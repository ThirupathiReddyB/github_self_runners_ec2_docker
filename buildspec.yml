version: 0.2

env:
  secrets-manager:
    ENV_FILE: "testing-dev"
    EC2_KEY: "test-dev"

  variables:
    AWS_DEFAULT_REGION: ap-south-1
    IMAGE_REPO_NAME: nodejs-testing
    IMAGE_TAG: latest
    EC2_HOST: 13.234.19.159
    EC2_USER: ubuntu

phases:
  pre_build:
    commands:
      - echo "$ENV_FILE" > .env
      - cat .env | head -5

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

      - mkdir -p ~/.ssh
      - echo "$EC2_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa

  build:
    commands:
      - docker build -t $IMAGE_REPO_NAME .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - docker push $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "echo '$ENV_FILE' > /home/ubuntu/.env"

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo aws ecr get-login-password --region $AWS_DEFAULT_REGION | sudo docker login --username AWS --password-stdin $ECR_URI"

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo docker pull $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG"

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo docker rm -f nodejs-testing || true"

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo docker run -d --name nodejs-testing -p 80:3000 --restart unless-stopped $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG"

      - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo docker ps"

artifacts:
  files:
    - '**/*'
